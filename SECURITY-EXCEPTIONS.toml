# Findings that are open, known, and accepted for now — each with a reason and a
# date. `.github/workflows/security-posture.yml` reads this file: an open high or
# critical alert with no entry here fails the build, an entry past its
# `review_by` fails the build, and an entry that no longer matches anything fails
# the build too, so the record cannot drift away from the product.
#
# The rule this file exists to serve: block on everything we can fix, never block
# on an upstream flaw with no fix available — but write down why, and when that
# will be looked at again.
#
# Fields: id, where, why, review_by are required. `source` narrows an entry to one
# scanner; `path` narrows it to one file, which matters for a rule that can fire
# anywhere — an entry for a CodeQL rule without a path would excuse the next real
# occurrence of it somewhere else.
#
# Started empty on 2026-10-10, when releaseradar joined the suite. The image is
# python:3.12-slim-trixie with nothing added by apt, so what the scanners will
# report is the base image's Debian packages (zlib, perl-base, libstdc++6 — the
# same findings the other five Radar record) and the Python closure, which here
# includes the `mcp` SDK: pydantic, starlette, uvicorn, jsonschema. Each
# position is to be read out of the Debian security tracker with `patchradar
# debian <CVE>` before it is written down, not inferred from a scanner's line.

# ─────────────────────────────────────────────────────────────────────────────
# The scanners spoke on 2026-10-10, two hours after the repository was created:
# Snyk Container, three high findings, all in Debian 13 packages of the
# python:3.12-slim-trixie base image and none in anything this image adds — it
# adds nothing with apt. The same three the other five Radar carry, read again
# that day with `patchradar debian` rather than copied:
#
#   zlib       open in bookworm, trixie, sid and forky alike, nothing scheduled,
#              Debian bug 1146895. Waiting is not a plan; evidence goes there.
#   attr, acl  already fixed in unstable and forky (1:2.6.0-1, 2.4.0-1), filed
#              no-dsa for trixie *because the fix comes in a point release*.
#              That waiting ends at a dated event: rebuild after it, which the
#              weekly rebuild of `latest` does on its own.
#
# Snyk was retired on 2026-11-02 (tests/test_workflow_set.py, RETIRED), and its
# three entries left with it. zlib's reason lives on in the Docker Scout entry
# for the same CVE. attr (CVE-2026-54371, Debian bug 1141107, a symlink
# traversal in recursive getfattr/setfattr) and acl (CVE-2026-54369, Debian bug
# 1141110, a local TOCTOU in recursive setfacl/chacl) are still in the image
# until the trixie point release; neither tool runs here. If Trivy's image scan
# reports either, its entry carries these facts under Trivy, with the same
# review date they had: 2026-11-30.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-85091"
source = "Docker Scout"
where = "zlib 1:1.3.dfsg+really1.3.1-1, python slim-trixie base image"
why = """
An out-of-bounds write reached through gzprintf. `patchradar debian` on \
2026-10-10: open in trixie at 1:1.3.dfsg+really1.3.1-1, no fixed version in any \
suite, urgency not yet assigned, Debian bug 1146895. releaseradar reaches zlib \
only through Python's own module, for the gzip-encoded responses httpx \
decompresses from api.github.com — one well-known peer, not arbitrary input. \
Nothing to ask for and nothing to wait for; what moves it is evidence on that \
bug. Reported by Docker Scout since the first scan of \
maksimtech/releaseradar:latest (2026.1) on 2026-10-10; until 2026-11-02 Snyk \
reported it too, as SNYK-DEBIAN13-ZLIB-19520500.
"""
review_by = "2026-12-31"

# ─────────────────────────────────────────────────────────────────────────────
# What Trivy's image scan reported on its first run here, 2026-11-02, the day
# Snyk was retired (maksimtech/apkradar#54). The same Debian packages of the
# python slim-trixie base image apkradar's first scan reported, none with a fix
# in trixie and none in code releaseradar runs. The maintainer decided on 2026-11-02
# that they wait for Debian's fixes, which the next release's rebuild picks up;
# the Debian positions were read for apkradar that day and are the same
# packages at the same versions here. The container runs as the unprivileged
# user `releaseradar` (Dockerfile, USER) and its entrypoint is releaseradar itself.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-54369"
source = "Trivy"
where = "acl 2.3.2-2+b1 (libacl1), python slim-trixie base image"
why = """
Debian bug 1141110: fixed in unstable and forky (acl 2.4.0-1), no-dsa for trixie \
with the fix scheduled for a point release. Debian's note says why it cannot be \
backported piecemeal — the fix adds the `acl_*_at()` ABI of 2.4.0. Reported by \
Snyk until it was retired on 2026-11-02; Trivy's image scan names it by CVE, and \
the reason has not changed.

The fix is scheduled, not absent, so the only thing to do is rebuild after the \
next trixie point release. The date below is set for that. A local TOCTOU in \
recursive setfacl/chacl; releaseradar calls neither.
"""
review_by = "2026-11-30"

[[exception]]
id = "CVE-2026-76642"
source = "Trivy"
where = "util-linux 2.41.5-0+deb13u1 (bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux), python slim-trixie base image"
why = """
libmount does not check the mount helper's exit status before running \
post-mount hooks (X-mount.idmap, X-mount.owner), so an unprivileged user may run \
privileged operations on existing filesystems. Debian tracker: no-dsa for trixie, \
"Minor issue"; fixed in forky and sid (2.42.3-1); bookworm not affected (as read \
for apkradar on 2026-11-02).

Needs a local user running `mount` inside the container. releaseradar never mounts \
anything. Like every finding in this block, it waits for Debian: `apt-get upgrade` runs at \
build time, so the release after Debian ships a fix carries it, and the review \
date is when to look at whether it has.
"""
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-78408"
source = "Trivy"
where = "util-linux 2.41.5-0+deb13u1 (bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux), python slim-trixie base image"
why = """
`nsenter --join-cgroup` opens cgroup.procs as root and keeps the descriptor \
open across namespace, credential and execve() changes (Ubuntu's summary). Local.

releaseradar never runs nsenter. Like every finding in this block, it waits for Debian: `apt-get upgrade` runs at \
build time, so the release after Debian ships a fix carries it, and the review \
date is when to look at whether it has.
"""
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-78409"
source = "Trivy"
where = "util-linux 2.41.5-0+deb13u1 (bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux), python slim-trixie base image"
why = """
The X-mount.subdir fast path on Linux 6.15+ passes the subdirectory to \
open_tree() with AT_SYMLINK_NOFOLLOW, which does not stop intermediate symlink \
traversal (Ubuntu's summary). Local, high attack complexity.

releaseradar never mounts anything. Like every finding in this block, it waits for Debian: `apt-get upgrade` runs at \
build time, so the release after Debian ships a fix carries it, and the review \
date is when to look at whether it has.
"""
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-78410"
source = "Trivy"
where = "util-linux 2.41.5-0+deb13u1 (bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux), python slim-trixie base image"
why = """
Restricted bind mounts read the source path from fstab without pinning it before \
the privileged mount, so a local user who can replace the source or a writable \
ancestor may exploit it (Ubuntu's summary). Local.

releaseradar never mounts anything and the image has no fstab entries of its own. \
Like every finding in this block, it waits for Debian: `apt-get upgrade` runs at \
build time, so the release after Debian ships a fix carries it, and the review \
date is when to look at whether it has.
"""
review_by = "2026-12-31"

[[exception]]
id = "CVE-2025-69720"
source = "Trivy"
where = "ncurses 6.5+20250216-2 (libncursesw6, libtinfo6, ncurses-base, ncurses-bin), python slim-trixie base image"
why = """
A stack buffer overflow in `analyze_string` of the `infocmp` program (NVD), \
fixed upstream in 6.5-20251213; trixie carries 6.5+20250216. Local, and it needs \
someone to run infocmp on a crafted terminal description.

releaseradar never runs infocmp; the libraries are in the image because Debian's own \
tools link them. Like every finding in this block, it waits for Debian: `apt-get upgrade` runs at \
build time, so the release after Debian ships a fix carries it, and the review \
date is when to look at whether it has.
"""
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-16742"
source = "Trivy"
where = "systemd 257.13-1~deb13u1 (libsystemd0, libudev1), python slim-trixie base image"
why = """
A local privilege escalation in systemd-homed: a logged-in, homed-managed user \
can be added to arbitrary system groups. Debian tracker: no-dsa for trixie, \
"Minor issue"; fixed in forky (262-1) and sid.

The image holds two systemd libraries and not systemd-homed, and no init system \
runs in the container: the flaw's component is not there. Like every finding in this block, it waits for Debian: `apt-get upgrade` runs at \
build time, so the release after Debian ships a fix carries it, and the review \
date is when to look at whether it has.
"""
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-9538"
source = "Trivy"
where = "perl 5.40.1-6+deb13u1 (perl-base), python slim-trixie base image"
why = """
A crafted file can crash perl — a denial of service (Ubuntu USN-8684-1, which \
fixes it; BellSoft fixes it in 5.40.4). Trixie has no fix per Trivy.

perl-base is Essential in Debian — dpkg depends on it — and cannot be removed; \
releaseradar is Python and never runs perl. Like every finding in this block, it waits for Debian: `apt-get upgrade` runs at \
build time, so the release after Debian ships a fix carries it, and the review \
date is when to look at whether it has.
"""
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-119373"
source = "Trivy"
where = "sqlite3 3.46.1-7+deb13u2 (libsqlite3-0), python slim-trixie base image"
why = """
SQLite before 3.54.0: an FTS5 heap buffer overflow in fts5MergeRowidLists() (OSV, 2026-11-02). Debian fixed it in sid (3.54.1-1) and marked it no-dsa for \
trixie, "Minor issue" (security tracker, 2026-11-09): no trixie update will come, \
so the +deb13u2 in the image keeps it. \
Docker Scout reports it too (below).

releaseradar does use SQLite: releaseradar/db.py keeps its data through Python's sqlite3 \
module, in a database file it creates itself. What it does not use is where these \
flaws are: its schema has no FTS5 table and it loads no extension, and Python's \
sqlite3 module exposes no Session Extension (checked on 2026-11-02). Reaching FTS5 \
would take a database file someone else wrote, opened in place of its own. Accepted on that ground, not on waiting for \
Debian: the review date is when to look for a base image with a fixed sqlite3.
"""
review_by = "2026-12-31"

