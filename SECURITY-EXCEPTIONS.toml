[[exception]]
id = "CVE-2026-95691"
source = "Docker Scout"
where = "openssl 3.5.7-1~deb13u3 (libssl3t64), python:3.14-slim-trixie base image"
why = """
OpenSSL advisory of 2026-11-10, which rates it Low; Docker Scout reports it as \
high. Fixed upstream in 3.5.10; Debian lists trixie (security) and unstable as \
unfixed, so there is no package to upgrade to yet. `apt-get upgrade` runs at \
build time, and the image is rebuilt at every release: the DSA arrives here \
without anyone chasing it, and this entry then fails the build as unused.

It is reached only by a QUIC client receiving retransmitted CRYPTO frames from a malicious QUIC server. \
Python's ssl module exposes neither QUIC nor AES-GCM-SIV, and hashlib does not \
expose AES at all. releaseradar's own TLS is Python's ssl module over TCP (httpx, to api.github.com); \
its dashboard serves plain HTTP on localhost and its MCP server speaks over \
stdio. Nothing encrypts a CMS message.
"""
review_by = "2026-12-15"

