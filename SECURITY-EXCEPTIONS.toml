# OpenSSL security advisory of 2026-11-10 (four Low issues, fixed in 3.5.10),
# reported by Docker Scout on 2026-11-17 against the trixie libssl3t64 of the
# base image. Review on 2026-12-15, or earlier when the DSA lands.
