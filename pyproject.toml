[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "releaseradar"
dynamic = ["version"]
description = "GitHub repo lifecycle tracker — from issue open to release published"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Massimo Moretti", email = "massimo.moretti@maksimtech.com"},
]
keywords = ["github", "release", "tracker", "issues", "pull-requests", "lifecycle", "devops", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The MCP server. Kept out of the base install on purpose: the `mcp` SDK brings
# pydantic, starlette, uvicorn, jsonschema and friends — 24 distributions where
# the CLI needs 16 — and a `releaseradar sync` in a cron job wants none of them.
# The Docker image installs it, so `docker run -i … mcp` works out of the box.
mcp = [
    "mcp>=2.0",
]
dev = [
    "mcp>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Replays responses recorded from api.github.com at the HTTP boundary. The
    # fixtures under tests/fixtures carry where and when each was recorded.
    "respx>=0.21",
    "ruff>=0.16",
    "mypy>=1.18",
    "mutmut>=3.8",
    # Read by the tests that check the workflows against pyproject.toml.
    "pyyaml>=6.0",
]

[project.scripts]
releaseradar = "releaseradar.cli:app"

[project.urls]
Homepage = "https://github.com/maksimtech/releaseradar"
Repository = "https://github.com/maksimtech/releaseradar"
Issues = "https://github.com/maksimtech/releaseradar/issues"
Changelog = "https://github.com/maksimtech/releaseradar/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "releaseradar/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 objects to function calls in argument defaults; Typer's entire API is
# exactly that: `def cmd(x: str = typer.Option(...))`.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "E402"]
# The dashboard page is one HTML/JS string; its lines are the browser's business.
"releaseradar/web.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.mutmut]
source_paths = ["releaseradar"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = [
    "Dockerfile",
    ".github",
    "CHANGELOG.md",
    "README.md",
    "tests/fixtures",
]
do_not_mutate = ["releaseradar/__init__.py"]
