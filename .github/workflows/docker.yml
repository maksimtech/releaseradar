name: Build and Push Docker Image
on:
  push:
    tags:
      - 'v*'
  schedule:
    # Weekly rebuild of `latest` from the newest tag so the image picks up
    # Debian's patches without waiting for a new release.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.1)'
        required: true
        default: 'v2026.1'
permissions:
  contents: read
  security-events: write
jobs:
  docker:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the Scout binary with the job's token
        # docker/scout-action downloads its binary anonymously and fails with a 403
        # when the runner's shared address has spent GitHub's 60-an-hour budget
        # (docker/scout-action#116). It uses the binary when it is already in place;
        # this puts the one of the pinned version there, checked against its digest
        # (tests/test_scout_binary.py). Here, before the step that checks out the tag
        # being built: a tag older than the script does not have it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch_scout_binary.sh e7e2a72bf1485d10a58f30696b6c513b261ce4fa v1.29.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            RAW=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${RAW}" >> $GITHUB_OUTPUT
          STRIPPED="${RAW#v}"
          NORMALIZED=$(python3 -c "parts='${STRIPPED}'.split('.'); print('.'.join(str(int(p)) for p in parts))")
          echo "PIP_VERSION=${NORMALIZED}" >> $GITHUB_OUTPUT
      - name: Stand on the tag being built
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: git checkout --detach "refs/tags/${VERSION}"
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maksimtech/releaseradar:latest
            ${{ github.event_name != 'schedule' && format('maksimtech/releaseradar:{0}', steps.version.outputs.VERSION) || '' }}
          build-args: |
            RELEASERADAR_SOURCE=local
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker Scout CVE scan
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: cves
          image: maksimtech/releaseradar:${{ github.event_name == 'schedule' && 'latest' || steps.version.outputs.VERSION }}
          only-severities: critical,high
          exit-code: false
          sarif-file: scout-results.sarif
      - name: Upload Scout SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: scout-results.sarif
