name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # The stable rows are the Pythons pyproject.toml promises; the `-dev`
        # row is the next minor, allowed to fail. tests/test_ci_contract.py
        # keeps the two lists equal and says what to promote when 3.15 is final.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          - python-version: "3.15-dev"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # The dev extra, or pytest is not here to run the suite with.
        run: pip install -e ".[dev]"  # NOSONAR - trusted internal project, no external setup scripts

      - name: Run test suite
        # No network: GitHub is replayed from tests/fixtures, and the MCP server
        # is driven over stdio as a subprocess of this interpreter.
        run: >-
          pytest tests/ -v
          --cov=releaseradar --cov-report=xml --cov-report=term-missing

      - name: Test CLI
        # --help costs nothing, needs no network, and catches an import error or
        # a broken entry point — which the suite, importing modules directly,
        # does not.
        run: releaseradar --help

      - name: Upload coverage to Codecov
        # Once, not once per matrix entry: the same report five times is five
        # uploads of one measurement.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # A failed upload loses a metric, it does not invalidate the tests that
          # just passed.
          fail_ci_if_error: false

  summary:
    # The branch ruleset requires a check named exactly "Tests". The matrix job
    # cannot provide it: its contexts carry the Python version, so they change
    # whenever the matrix does. This job gives the ruleset one stable name.
    # always(): a skipped required check counts as passed, so this has to run
    # even when the matrix fails, and fail explicitly in that case.
    name: Tests
    needs: [test]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: All test jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A required test job ended with: $result"; exit 1; }
          done
