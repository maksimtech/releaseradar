name: Docker Scout CVE Scan
on:
  # Also as soon as a new image is on Docker Hub: until 2026-10-24 the scan, and the
  # Security Posture gate that reads it, kept describing the image a release had
  # replaced until somebody dispatched them by hand.
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
  # The scan reads maksimtech/releaseradar:latest from Docker Hub, so it is only
  # meaningful once a new image is published — which happens on a tag, not on a
  # push to main. Without this, re-scanning after a release meant re-running an
  # earlier run by hand.
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 4 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  scout:
    name: Docker Scout
    # After a push that failed, Docker Hub still has the old image: nothing to rescan.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          # cves says what is broken in the image and feeds the Security tab;
          # if this step fails, the job does.
          command: cves
          image: maksimtech/releaseradar:latest
          only-severities: critical,high
          exit-code: false
          sarif-file: scout-results.sarif
      - name: Docker Scout base image recommendations
        # recommendations says whether a base image exists that fixes those
        # CVEs. On 2026-09-26 the first scan of exeradar found five HIGH CVEs,
        # all of them in python:3.14-slim-trixie and none in this project's
        # code — a fact nobody can act on without this command. It is advice:
        # from 2026-10-24 the scout CLI crashed in it (nil pointer in
        # recommendations/markdown.go) on python:3.12-slim-trixie images, and
        # run together with cves it turned every scan red. A failure here
        # shows in the log and fails nothing (tests/test_scout_steps.py).
        continue-on-error: true
        uses: docker/scout-action@v1
        with:
          command: recommendations
          image: maksimtech/releaseradar:latest
      - name: Upload Scout results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('scout-results.sarif') != ''
        with:
          sarif_file: scout-results.sarif
