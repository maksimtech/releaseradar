name: CodSpeed
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'releaseradar/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/codspeed.yml'
  workflow_dispatch:
permissions:
  contents: read
  # CodSpeed authenticates the upload with the job's OIDC token: no secret.
  id-token: write
jobs:
  benchmarks:
    name: Run benchmarks
    # The last job to move to ubuntu-26.04. It stayed on 24.04 when the rest
    # moved on 2026-10-02: CodSpeedHQ/action v5 failed there with
    # `##[error]Unsupported system`. CodSpeed's runner and action v5.5.0
    # (2026-10-14) added Ubuntu 26.04 on x86_64 and arm64, so the action below
    # moves from v5.4.2 to v5.6.3, the version the other Radars pin:
    # https://github.com/CodSpeedHQ/runner/releases/tag/v5.5.0
    #
    # A named image, never `ubuntu-latest`: that label moves on GitHub's
    # schedule, and a job that breaks then breaks on main at a moment nobody
    # picked (tests/test_runners.py).
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Every pip, uv and python after this goes through Aikido Safe Chain
      # (tests/test_safe_chain.py).
      - name: Aikido Safe Chain
        uses: ./.github/actions/safe-chain
      - name: Install dependencies
        # pytest-codspeed is installed here and nowhere else: the suite must not
        # need a benchmark runner to check correctness (WORKFLOW_ONLY in
        # tests/test_declared_imports.py). Without it the benchmarks skip.
        run: |
          pip install -e ".[dev]"  # NOSONAR - trusted internal project, no external setup scripts
          pip install pytest-codspeed --only-binary :all:
      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: pytest tests/benchmarks/ --codspeed
