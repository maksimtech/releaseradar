name: Publish to PyPI
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/releaseradar
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Every pip, uv and python after this goes through Aikido Safe Chain
      # (tests/test_safe_chain.py).
      - name: Aikido Safe Chain
        uses: ./.github/actions/safe-chain
      - name: Install build dependencies
        run: pip install --upgrade build hatchling  # NOSONAR
      # Without isolation: python -m build would fetch hatchling into an environment
      # of its own, which the python shim passes straight through, unchecked. The
      # step above installed it through Safe Chain (tests/test_safe_chain.py).
      - name: Build package
        run: python -m build --no-isolation
      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" > /tmp/gpg_key.asc
          gpg --batch --import /tmp/gpg_key.asc
          rm /tmp/gpg_key.asc
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --passphrase-fd 0 --pinentry-mode loopback --list-secret-keys
      - name: Sign packages
        run: |
          for f in dist/*; do
            echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --passphrase-fd 0 \
              --pinentry-mode loopback \
              --armor --detach-sign "$f"
          done
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verify-metadata: false

      - name: Extract version
        id: version
        env:
          RAW: ${{ github.ref_name }}
        run: |
          STRIPPED="${RAW#v}"
          NORMALIZED=$(python3 -c "parts='${STRIPPED}'.split('.'); print('.'.join(str(int(p)) for p in parts))")
          echo "VERSION=${NORMALIZED}" >> "$GITHUB_OUTPUT"

      # No margin, and the install is asked again instead. On v2026.2 the wait saw
      # the file and the fresh venv two steps later was answered by an edge that had
      # not — "from versions: 2026.1" — and the job went red after a successful
      # upload. A 45 s grace went in and lost again on v2026.4; what held was asking
      # the install itself again, ten attempts half a minute apart. That loop sat
      # here, inline and untested; it is now install_from_pypi.sh, the same script in
      # all six Radar, run by tests/test_install_from_pypi.py.
      - name: Wait for the index to catch up
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: bash .github/scripts/wait_for_pypi.sh releaseradar "$VERSION" 30 20 0

      - name: Check the published wheel installs and runs
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          python -m venv "${RUNNER_TEMP}/verify"
          bash .github/scripts/install_from_pypi.sh "${RUNNER_TEMP}/verify" releaseradar "$VERSION" 10 30
          "${RUNNER_TEMP}/verify/bin/releaseradar" --version
